<div class="pagecontent">
   
        <mat-card>
          <mat-card-content>
            <!-- Search box -->
            <div style="display:flex; justify-content:flex-end;"> 
               <div style="justify-content:left;margin-top: 20px;">
                <a style="cursor: pointer; text-decoration: underline;margin: 50px;" (click)="addPlan();">+ ADD PLAN</a></div>  
              <div style="justify-content:left;">
                <mat-paginator style="background-color: #f4f3f3;" #mainPaginator [pageSizeOptions]="[10, 25, 50, 100]"
                  [pageSize]="10"></mat-paginator>
              </div>

              <mat-form-field appearance="outline" class="search-box">
                <mat-label>Search</mat-label>
                <input matInput (keyup)="applyFilter($event)" placeholder="Search records">
              </mat-form-field>
            </div>
            <!-- Data Table -->
            <div class="mat-elevation-z8">
              <table mat-table [dataSource]="dataSource" matSort #mainSort="matSort" >                 
                  
                <ng-container matColumnDef="plan_name">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>PLAN NAME</th>
                  <td mat-cell *matCellDef="let row">{{ row.plan_name }}</td>
                </ng-container>
                <ng-container matColumnDef="start_date">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>START DATE</th>
                  <td mat-cell *matCellDef="let row">{{ row.start_date }}</td>
                </ng-container>
                <ng-container matColumnDef="end_date">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>END DATE</th>
                  <td mat-cell *matCellDef="let row" class="txlink" >{{ row.end_date }}</td>
                </ng-container> 
                <ng-container matColumnDef="status">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>STATUS</th>
                  <td mat-cell *matCellDef="let row">{{ row.planstatus }}</td>
                </ng-container>
                <ng-container matColumnDef="1">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>ACTION</th>
                  <td mat-cell *matCellDef="let row">  
                    <mat-icon class="txlink" (click)="editPlan(row)" title="Edit" style="cursor: pointer;">edit</mat-icon> 
                    <mat-icon class="txlink"  (click)="attach(row,'plan')" title="Attachments" style="cursor: pointer;">attach_file</mat-icon> 
                  </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
              </table>

            </div>
          </mat-card-content>
        </mat-card> 
</div>

<div class="loader-backdrop" *ngIf="isLoading">
  <mat-spinner diameter="60"></mat-spinner>
</div>
