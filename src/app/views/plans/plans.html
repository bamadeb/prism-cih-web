<div class="pagecontent">
   
        <mat-card>
          <mat-card-content>
            <!-- Search box -->
            <div class="table-toolbar">
              <button mat-raised-button color="primary" (click)="addPlan();">
                <mat-icon>add</mat-icon> ADD PLAN
              </button>

              <mat-paginator #mainPaginator [length]="dataSource.filteredData.length" [pageSizeOptions]="[10, 25, 50, 100]"
                [pageSize]="10"></mat-paginator>

              <mat-form-field appearance="outline" class="search-box">
                <mat-label>Search</mat-label>
                <input matInput (keyup)="applyFilter($event)" placeholder="Search records">
              </mat-form-field>
            </div>
            <!-- Data Table -->
            <div class="table-card" style="overflow:auto;">
              <table mat-table [dataSource]="dataSource" matSort #mainSort="matSort" class="txupper w-100">

                <ng-container matColumnDef="plan_name">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>PLAN NAME</th>
                  <td mat-cell *matCellDef="let row">{{ row.plan_name }}</td>
                </ng-container>
                <ng-container matColumnDef="start_date">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>START DATE</th>
                  <td mat-cell *matCellDef="let row">{{ row.start_date }}</td>
                </ng-container>
                <ng-container matColumnDef="end_date">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>END DATE</th>
                  <td mat-cell *matCellDef="let row">{{ row.end_date }}</td>
                </ng-container>
                <ng-container matColumnDef="status">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>STATUS</th>
                  <td mat-cell *matCellDef="let row">
                    <span class="status-badge" [ngClass]="getPlanStatusClass(row)">{{ row.planstatus }}</span>
                  </td>
                </ng-container>
                <ng-container matColumnDef="1">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>ACTION</th>
                  <td mat-cell *matCellDef="let row">
                    <div class="icon-cell">
                      <mat-icon class="action-icon" (click)="editPlan(row)" title="Edit">edit</mat-icon>
                      <mat-icon class="action-icon" (click)="attach(row,'plan')" title="Attachments">attach_file</mat-icon>
                    </div>
                  </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
              </table>
            </div>
            <div class="no-record" *ngIf="!isLoading && dataSource?.data?.length === 0">
              No records found
            </div>
          </mat-card-content>
        </mat-card> 
</div>

<div class="loader-backdrop" *ngIf="isLoading">
  <mat-spinner diameter="50"></mat-spinner>
</div>
