<div class="pagecontent">
   
        <mat-card>
          <mat-card-content>
            <!-- Search box -->
            <div class="table-toolbar">
              <button mat-raised-button color="primary" (click)="addUser();">
                <mat-icon>add</mat-icon> ADD USER
              </button>

              <mat-paginator #mainPaginator [length]="dataSource.filteredData.length" [pageSizeOptions]="[10, 25, 50, 100]"
                [pageSize]="10"></mat-paginator>

              <mat-form-field appearance="outline" class="search-box">
                <mat-label>Search</mat-label>
                <input matInput (keyup)="applyFilter($event)" placeholder="Search records">
              </mat-form-field>
            </div>
            <!-- Data Table -->
            <div class="table-card" style="overflow:auto;">
              <table mat-table [dataSource]="dataSource" matSort #mainSort="matSort" class="w-100">

                <ng-container matColumnDef="firstName">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>First Name</th>
                  <td mat-cell *matCellDef="let row">{{ row.firstName }}</td>
                </ng-container>
                <ng-container matColumnDef="lastName">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Last Name</th>
                  <td mat-cell *matCellDef="let row">{{ row.lastName }}</td>
                </ng-container>
                <ng-container matColumnDef="email">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
                  <td mat-cell *matCellDef="let row">{{ row.email }}</td>
                </ng-container>
                <ng-container matColumnDef="department">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Department</th>
                  <td mat-cell *matCellDef="let row">{{ row.department }}</td>
                </ng-container>

                 <ng-container matColumnDef="role">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>ROLE</th>
                  <td mat-cell *matCellDef="let row">{{ row.role }}</td>
                </ng-container>
                <ng-container matColumnDef="status">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
                  <td mat-cell *matCellDef="let row">
                    <span class="status-badge" [ngClass]="getStatusClass(row)">{{ row.locked ? 'Locked' : row.status }}</span>
                  </td>
                </ng-container>
                <ng-container matColumnDef="1">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>ACTION</th>
                  <td mat-cell *matCellDef="let row">
                    <div class="icon-cell">
                      <mat-icon class="action-icon" (click)="editUser(row)" title="Edit">edit</mat-icon>
                      <mat-icon
                        *ngIf="row.locked"
                        class="action-icon action-icon-unlock"
                        (click)="unlockUser(row)"
                        title="Unlock User">
                        lock_open
                      </mat-icon>
                    </div>
                  </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"  [ngClass]="{'locked-row': row.locked}"></tr>
              </table>

            </div>
             <div class="no-record" *ngIf="!isLoading && dataSource?.data?.length === 0">
              No records found
            </div>
          </mat-card-content>
        </mat-card> 
</div>

<div class="loader-backdrop" *ngIf="isLoading">
  <mat-spinner diameter="50"></mat-spinner>
</div>
