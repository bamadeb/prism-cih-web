<div class="pagecontent">
   
        <mat-card>
          <mat-card-content>
            <!-- Search box -->
            <div class="table-toolbar">
              <button mat-raised-button color="primary" (click)="add();">
                <mat-icon>add</mat-icon> ADD PAGE
              </button>

              <mat-paginator #mainPaginator [length]="dataSource.filteredData.length" [pageSizeOptions]="[10, 25, 50, 100]"
                [pageSize]="10"></mat-paginator>

              <mat-form-field appearance="outline" class="search-box">
                <mat-label>Search</mat-label>
                <input matInput (keyup)="applyFilter($event)" placeholder="Search records">
              </mat-form-field>
            </div>
            <!-- Data Table -->
            <div class="table-card" style="overflow:auto;">
              <table mat-table [dataSource]="dataSource" matSort #mainSort="matSort" class="txupper w-100">
                  <ng-container matColumnDef="page_name">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Page</th>
                  <td mat-cell *matCellDef="let row">{{ row.page_name }}</td>
                </ng-container>
                <ng-container matColumnDef="ROLE_NAME">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Role</th>
                  <td mat-cell *matCellDef="let row">{{ row.ROLE_NAME }}</td>
                </ng-container>

                <ng-container matColumnDef="status_text">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
                  <td mat-cell *matCellDef="let row">
                    <span class="status-badge" [ngClass]="getPageAccessStatusClass(row)">{{ row.status_text }}</span>
                  </td>
                </ng-container>
                <ng-container matColumnDef="1">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>ACTION</th>
                  <td mat-cell *matCellDef="let row">
                    <div class="icon-cell">
                      <mat-icon class="action-icon" (click)="edit(row)" title="Edit">edit</mat-icon>
                    </div>
                  </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
              </table>

            </div>
             <div class="no-record" *ngIf="!isLoading && dataSource?.data?.length === 0">
              No records found
            </div>
          </mat-card-content>
        </mat-card> 
</div>

<div class="loader-backdrop" *ngIf="isLoading">
  <mat-spinner diameter="50"></mat-spinner>
</div>
