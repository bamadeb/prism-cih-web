<h2 mat-dialog-title class="text-center">{{ data.title }}</h2>

<mat-dialog-content class="text-center">

  <!-- User Info -->
  <div style="font-weight:bold; font-size:16px;">
    {{ data.name }}<br>
    <span class="material-icons" style="font-size:18px;">email</span>
    {{ data.email }}
     <span class="material-icons" style="font-size:18px;">badge</span>
    {{ data.role }} 
  </div>

  <p style="margin-top:15px; font-size:16px;">
    {{ data.messaage }}
  </p>

  <form [formGroup]="noteForm">
    <mat-form-field appearance="outline" style="width: 400px; max-width: 100%;">
      <mat-label>NOTE</mat-label>
      <input matInput formControlName="note" [attr.maxlength]="noteMax">
      <mat-error *ngIf="noteForm.get('note')?.hasError('required') || noteForm.get('note')?.hasError('whitespace')">
        Note is required
      </mat-error>
      <mat-error *ngIf="noteForm.get('note')?.hasError('maxlength')">
        Note must be {{ noteMax }} characters or fewer
      </mat-error>
    </mat-form-field>
  </form>

  

</mat-dialog-content>

<mat-dialog-actions align="center">
  <button mat-raised-button color="primary"
          (click)="confirm(true)">
    Yes
  </button>

  <button mat-raised-button color="warn"
          (click)="confirm(false)">
    No
  </button>
</mat-dialog-actions>

<div class="loader-backdrop" *ngIf="isLoading">
  <mat-spinner diameter="60"></mat-spinner>
</div>
